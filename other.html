      <!-- body -->
      <div id="nda-view">
         <div class="bodymargin">
            <form class="nda-login fadeInUp inter" id="nda-login">
               <p style="font-size: xx-large;">WIP, Sculpts and NDA</p>
               <p style="font-size: medium; font-weight: 450;">This section is password protected.</p>
               <input type="password" id="nda-password" placeholder="Password" autocomplete="current-password" required autofocus>
               <button type="submit" id="nda-submit">Unlock</button>
               <p class="nda-error" id="nda-error"></p>
            </form>
         </div>
      </div>

      <script>
         const view = document.getElementById("nda-view");
         const lockLink = document.querySelector(".nda-lock");

         function route() {
            const id = location.hash.slice(1);
            return id ? NDA.renderPage(view, id) : NDA.renderHub(view);
         }
         function unlocked() {
            lockLink.hidden = false;
            window.addEventListener("hashchange", route);
            return route();
         }

         document.getElementById("nda-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            const button = document.getElementById("nda-submit");
            const error = document.getElementById("nda-error");
            button.disabled = true;
            error.textContent = "Unlocking...";
            try {
               await NDA.unlock(document.getElementById("nda-password").value);
               await unlocked();
            } catch (err) {
               error.textContent = "Wrong password.";
               button.disabled = false;
            }
         });

         document.getElementById("nda-lock").addEventListener("click", (e) => {
            e.preventDefault();
            NDA.lock();
            location.replace("other.html");
         });

         NDA.restore().then((ok) => ok && unlocked());
      </script>
